[experiment]
forecast_config = "configs/forecast.toml"
output_dir = "results/generated/xgboost"
seed = 2112
threads = 4
# Predeclared, bounded search: three CPU fits per target; no test-year access.
selection_demand = "evening_16_21"
selection_pv = "full_day"

[carbon]
country_iso_code = "AUS"
# Assumed CPU TDP (CodeCarbon constant mode uses 50%) and RAM watts, not measured power.
cpu_power_w = 15.0
ram_power_w = 3.0

[[candidates]]
name = "shallow"
n_estimators = 200
max_depth = 3
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.9
min_child_weight = 10
reg_lambda = 10.0

[[candidates]]
name = "medium"
n_estimators = 300
max_depth = 5
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.9
min_child_weight = 10
reg_lambda = 10.0

[[candidates]]
name = "deeper"
n_estimators = 400
max_depth = 6
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.9
min_child_weight = 10
reg_lambda = 10.0
